# =============================================================================
# Blender Extension Manifest (Blender 4.5+)
# https://docs.blender.org/manual/en/latest/advanced/extensions.html
# =============================================================================

schema_version = "1.0.0"

# =============================================================================
# Extension Identification
# =============================================================================
id = "character_dna"
name = "Character DNA"
tagline = "Customize MetaHuman DNA files with RigLogic evaluation support"
version = "0.12.17"
type = "add-on"

# =============================================================================
# Maintainer Information
# =============================================================================
maintainer = "Poly Hammer <info@polyhammer.com>"
website = "https://polyhammer.com"

# =============================================================================
# Blender Compatibility
# =============================================================================
# Minimum Blender version required
blender_version_min = "4.5.0"
# Maximum Blender version supported
blender_version_max = "5.3.0"

# =============================================================================
# License Information
# =============================================================================
# The add-on's own code is licensed under GPL-3.0. It also bundles and
# redistributes the OpenRigLogic DNA/RigLogic Python bindings, the ufbx Python
# bindings, and the Sentry SDK.
license = ["GPL-3.0 license", "MIT license"]
copyright = [
    "2026 Poly Hammer",
    "2026 Epic Games, Inc. (OpenRigLogic DNA and RigLogic libraries, MIT License)",
    "2018 Functional Software, Inc. dba Sentry (sentry-sdk, MIT License)",
    "2020 Samuli Raivio (ufbx, MIT License)",
]

# =============================================================================
# Extension Description
# =============================================================================
description = """
Character DNA is an industry grade Blender addon that provides comprehensive support
for Epic Games' MetaHuman DNA file format.

## Key Features

- **DNA Import/Export**: Read and write MetaHuman DNA files (head and body)
- **DNA Calibration**: Modify MetaHuman characters and export changes back to DNA format
- **RigLogic Integration**: Real-time facial animation evaluation via the RigLogic library
- **RBF Solvers**: Radial Basis Function solvers for body pose corrections
- **Animation Support**: Import and body and face board animations

## Supported Workflows

- Import MetaHuman characters into Blender with full rig support
- Customize character appearance and rig behavior
- Export modifications back to DNA format
- Send customized MetaHumans to MetaHuman Creator via DNA files
- Import and work with facial animations
- Customize RigLogic expressions and poses

## Requirements

- Blender 4.5 or newer
- Platform-specific RigLogic bindings (available at polyhammer.com)
- Sentry SDK for error reporting (bundled)

For detailed documentation, visit: https://docs.polyhammer.com/character-dna-addon/
"""

# =============================================================================
# Categories and Tags
# =============================================================================
tags = ["Rigging", "Animation", "Import-Export", "3D View"]

# =============================================================================
# Platforms
# =============================================================================
# Platforms this extension supports
# Leave empty for pure Python extensions
platforms = ["windows-x64", "linux-x64", "macos-arm64"]

# =============================================================================
# Permissions
# =============================================================================
# File access for DNA import/export operations
permissions = { files = "Import and export DNA files", network = "Error reporting via Sentry and license validation" }

# =============================================================================
# Wheels (Python Dependencies)
# =============================================================================
# Python packages required by this extension
# These will be installed automatically when the extension is enabled.
# The pyufbx wheels are native and therefore per-platform and per-Python-ABI: the
# packager keeps only the wheels matching each platform in that platform's zip, and
# Blender then installs the cp311 (Blender 4.5) or cp313 (Blender 5.x) wheel that
# matches its own interpreter.
wheels = [
    "./wheels/sentry_sdk-2.52.0-py2.py3-none-any.whl",
    "./wheels/pyufbx-0.0.0-cp311-cp311-win_amd64.whl",
    "./wheels/pyufbx-0.0.0-cp311-cp311-macosx_11_0_arm64.whl",
    "./wheels/pyufbx-0.0.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/pyufbx-0.0.0-cp313-cp313-win_amd64.whl",
    "./wheels/pyufbx-0.0.0-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/pyufbx-0.0.0-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.manylinux_2_28_x86_64.whl",
]

# =============================================================================
# Build Settings
# =============================================================================
[build]
# Paths to exclude from the extension package
paths_exclude_pattern = [
    "__pycache__/",
    "*.pyc",
    "*.pyo",
    ".git/",
    ".gitignore",
    ".gitattributes",
    "*.blend1",
    "*.blend2",
    ".DS_Store",
    "Thumbs.db",
    "tests/",
    "docs/",
    ".ruff_cache/",
    ".pytest_cache/",
    ".mypy_cache/",
    "*.md",
    "requirements.txt",
    "bindings/windows",
    "bindings/macos",
    "bindings/linux",
]
