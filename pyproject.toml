[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Poly Hammer"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: 3D Modeling"
]
dependencies = [
  "sentry-sdk>=2.52.0",
]
description = "Blender addon for importing/exporting MetaHuman DNA files with RigLogic integration"
keywords = ["blender", "metahuman", "dna", "riglogic", "animation", "3d"]
name = "character-dna-addon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
version = "0.13.3"

[project.optional-dependencies]
dev = [
  "debugpy>=1.8.13",
  "bpy>=4.5.1,<5.2; python_version < '3.13'",
  "bpy>=5.2; python_version >= '3.13'",
  "pytest>=8.3.3",
  "pytest-dotenv>=0.5.2",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "genbadge[all]>=1.1.2",
  "mkdocs>=1.6.1",
  "poly-hammer-utils>=0.4.0",
  "ruff>=0.8.0",
  "pre-commit>=4.0.0"
]
# NOTE: Install stubs into a SEPARATE virtual environment (.stubs-venv), not the main .venv
# This avoids conflicts with the bpy package. See AGENT_INSTRUCTIONS.md for setup commands.
stubs = [
  "fake-bpy-module-latest"
]

[project.urls]
Documentation = "https://docs.polyhammer.com/character-dna-addon/"
Repository = "https://github.com/poly-hammer/character-dna-addon"

# =============================================================================
# Bandit Configuration (Security Linting)
# =============================================================================
[tool.bandit]
exclude_dirs = [
  "tests",
  "scratches",
  ".venv",
  ".stubs-venv",
  "build",
  "reports"
]
skips = [
  "B101",  # assert_used (needed for tests)
  "B104",  # hardcoded_bind_all_interfaces
  "B602",  # subprocess_popen_with_shell_equals_true (CWE-78)
  "B603",  # subprocess_without_shell_equals_true (CWE-78)
  "B604",  # any_other_function_with_shell_equals_true (CWE-78)
  "B605",  # start_process_with_a_shell (CWE-78)
  "B606",  # start_process_with_no_shell (CWE-78)
  "B607"  # start_process_with_partial_path (CWE-78)
]

[tool.coverage.html]
directory = "reports/coverage/html"

[tool.coverage.report]
exclude_also = [
  # Don't complain about missing debug-only code
  "def __repr__",
  "if self\\.debug",
  # Don't complain if tests don't hit defensive assertion code
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain if non-runnable code isn't run
  "if 0:",
  "if __name__ == .__main__.:",
  # Don't complain about abstract methods
  "@(abc\\.)?abstractmethod",
  # Type checking blocks
  "if TYPE_CHECKING:"
]
ignore_errors = true
precision = 2
show_missing = true

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
branch = true
omit = [
  "src/addons/character_dna/resources/*",
  "src/addons/character_dna/bindings/*"
]
parallel = true
source = ["src/addons/character_dna"]

[tool.coverage.xml]
output = "reports/coverage/results.xml"

[tool.hatch]

[tool.hatch.build.targets.wheel]
packages = ["src/addons/character_dna"]

# =============================================================================
# uv Sources
# =============================================================================
# ufbx Python bindings used to read FBX animation. Resolved from the same
# pre-built wheels the extension bundles
[tool.uv.sources]
pyufbx = [
  {path = "src/addons/character_dna/wheels/pyufbx-0.0.0-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32' and python_full_version >= '3.11' and python_full_version < '3.12'"},
  {path = "src/addons/character_dna/wheels/pyufbx-0.0.0-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_full_version >= '3.13' and python_full_version < '3.14'"},
  {path = "src/addons/character_dna/wheels/pyufbx-0.0.0-cp311-cp311-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and python_full_version >= '3.11' and python_full_version < '3.12'"},
  {path = "src/addons/character_dna/wheels/pyufbx-0.0.0-cp313-cp313-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and python_full_version >= '3.13' and python_full_version < '3.14'"},
  {path = "src/addons/character_dna/wheels/pyufbx-0.0.0-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and python_full_version >= '3.11' and python_full_version < '3.12'"},
  {path = "src/addons/character_dna/wheels/pyufbx-0.0.0-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and python_full_version >= '3.13' and python_full_version < '3.14'"},
]

# =============================================================================
# MyPy Configuration (optional, for those who prefer mypy)
# =============================================================================
[tool.mypy]
exclude = [
  "build/",
  "scratches/",
  "reports/",
  ".venv/",
  ".stubs-venv/"
]
ignore_missing_imports = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

# =============================================================================
# Pylance / Pyright Configuration (for VS Code integration)
# =============================================================================
[tool.pyright]
exclude = [
  "**/.*",
  "**/__pycache__",
  "**/node_modules",
  ".venv",
  ".stubs-venv",
  "build",
  "scratches",
  "reports",
  "releases",
  "src/addons/character_dna/core",
  "src/addons/character_dna/resources",
  "src/addons/character_dna/bindings"
]
# Extra paths for imports
extraPaths = [
  "src/addons",
  ".stubs-venv/Lib/site-packages",
  "src/addons/character_dna/resources/packages",
  "src/addons/character_dna/resources/unreal",
  "src/addons/character_dna/bindings/windows/amd64"
]
# Source roots
include = ["src/addons", "tests"]
pythonPlatform = "All"
pythonVersion = "3.13"
reportGeneralTypeIssues = "warning"
# Type checking settings
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedFunction = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
# Stub paths
stubPath = ".stubs-venv/Lib/site-packages"
typeCheckingMode = "basic"

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest]

[tool.pytest.ini_options]
addopts = [
  "--tb=long",
  "-vv",
  "--junitxml=reports/pytest/results.xml",
  "--ignore-glob=scratches/**",
  "-o",
  "junit_family=legacy"
]
env_files = [".env"]
filterwarnings = []
log_cli = true
log_level = "DEBUG"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
minversion = "8.0"
pythonpath = ["tests", "src/addons"]
testpaths = ["tests"]

# =============================================================================
# Ruff Configuration - Unified Linting & Formatting
# =============================================================================
[tool.ruff]
# Files/directories to exclude
exclude = [
  ".git",
  ".github",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  ".stubs-venv",
  "__pycache__",
  "build",
  "dist",
  "node_modules",
  "releases",
  "reports",
  "scratches",
  "scripts",
  "tests",
  "*.pyi",
  "src/addons/character_dna/resources/*",
  "src/addons/character_dna/bindings/*"
]
# Line length to match Black's default
line-length = 120
# Include source directories
src = ["src/addons", "tests"]
# Target Python version (matches Blender 4.5+)
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "lf"
# Formatting configuration (replaces Black)
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow autofix for all enabled rules when `--fix` is provided
fixable = ["ALL"]
# Rules to ignore
ignore = [
  "ANN401",  # Dynamically typed expressions (Any) are disallowed
  "COM812",  # Trailing comma missing (conflicts with formatter)
  "ISC001",  # Implicit string concatenation (conflicts with formatter)
  "PLR0913",  # Too many arguments in function definition
  "PLR2004",  # Magic value used in comparison
  "S101",  # Use of assert detected (needed for tests)
  "TC001",  # Move import into type-checking block (can cause runtime issues)
  "TC002",  # Move third-party import into type-checking block
  "TC003",  # Move standard library import into type-checking block
  "ARG002",  # Unused method argument (common in Blender operators)
  "N801",  # Invalid class name (allow Blender UI conventions like FOLDER_UL_, PANEL_PT_, etc.)
  "N802",  # Function name should be lowercase (Blender uses mixed case)
  "N803",  # Argument name should be lowercase (Blender properties)
  "N806",  # Variable should be lowercase (Blender API)
  "N812",  # Lowercase imported as non-lowercase
  "N815",  # Variable in class scope should not be mixedCase
  "N816",  # Variable in global scope should not be mixedCase
  "RUF012",  # Mutable class attributes should be annotated with ClassVar
  "PLW0603",  # Using global statement
  "ANN204",  # Missing return type annotation for special method
  "RET504",  # Unnecessary assignment before return
  "SIM108",  # Use ternary operator
  "B008",  # Do not perform function calls in argument defaults
  "G004",  # Logging statement uses f-string (allow f-strings in logging)
  "TID252",  # Prefer absolute imports over relative imports from parent modules (disabled for Blender addons)
  "PLC0415",  # Import should be at the top-level of a file (disabled for conditional imports)
  "F405"  # name may be undefined from star import
]
# Enable rule sets - comprehensive linting
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG",  # flake8-unused-arguments
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "ERA",  # eradicate (commented-out code)
  "PL",  # Pylint
  "RUF",  # Ruff-specific rules
  "N",  # pep8-naming
  "ANN",  # flake8-annotations
  "S",  # flake8-bandit (security)
  "A",  # flake8-builtins
  "COM",  # flake8-commas
  "DTZ",  # flake8-datetimez
  "T10",  # flake8-debugger
  "EXE",  # flake8-executable
  "ISC",  # flake8-implicit-str-concat
  "ICN",  # flake8-import-conventions
  "LOG",  # flake8-logging
  "G",  # flake8-logging-format
  "PIE",  # flake8-pie
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RSE",  # flake8-raise
  "RET",  # flake8-return
  "SLF",  # flake8-self
  "SLOT",  # flake8-slots
  "TID",  # flake8-tidy-imports
  "INT",  # flake8-gettext
  "FLY",  # flynt
  "PERF",  # Perflint
  "FURB"  # refurb
]
unfixable = []

[tool.ruff.lint.flake8-annotations]
# Allow missing annotations for self and cls
allow-star-arg-any = true
mypy-init-return = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like [], {}, set()
extend-immutable-calls = ["bpy.props.StringProperty", "bpy.props.BoolProperty", "bpy.props.IntProperty", "bpy.props.FloatProperty", "bpy.props.EnumProperty", "bpy.props.CollectionProperty", "bpy.props.PointerProperty", "bpy.props.FloatVectorProperty", "bpy.props.IntVectorProperty"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforce relative imports within the addon for better portability
ban-relative-imports = "parents"  # Allow relative imports from same/child modules, ban from parents

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
# isort configuration (replaces standalone isort)
known-first-party = ["character_dna"]
known-third-party = ["bpy", "bmesh", "mathutils", "riglogic"]
lines-after-imports = 2
lines-between-types = 1
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pep8-naming]
# Allow Blender's mixedCase conventions
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files often have unused imports
"**/__init__.py" = [
  "F401",  # Allow unused imports
  "F403"  # Allow star imports
]
# Operators may have unused context argument
"**/operators.py" = [
  "ARG001",  # Unused function argument (context)
  "ARG002"  # Unused method argument (context)
]
# Tests can use assertions and have more relaxed rules
"tests/**/*.py" = [
  "S101",  # Allow assert in tests
  "ANN",  # Don't require type annotations in tests
  "PLR0913",  # Allow many arguments in test functions
  "ARG001",  # Allow unused arguments (fixtures)
  "ARG002",  # Allow unused arguments
  "SLF001"  # Allow private member access in tests
]

# =============================================================================
# uv Configuration
# =============================================================================
[tool.uv]
override-dependencies = [
  # Pin numpy per Python version: bpy pins numpy<2.0 but numpy 1.x has no
  # pre-built wheels for Python 3.13, causing source builds that hang on
  # Windows CI. bpy 5.1 works fine with numpy 2.x at runtime (Blender 5.1
  # bundles it internally).
  "numpy==1.26.4; python_version == '3.11'",
  "numpy==2.3.4; python_version == '3.13'",
]

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 60

# =============================================================================
# Dependency Groups (replaces deprecated tool.uv.dev-dependencies)
# =============================================================================
[dependency-groups]
dev = [
  "debugpy>=1.8.13",
  "bpy>=4.5.1,<5.2; python_version < '3.13'",
  "bpy>=5.2; python_version >= '3.13'",
  "pytest>=8.3.3",
  "pytest-dotenv>=0.5.2",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "genbadge[all]>=1.1.2",
  "mkdocs>=1.6.1",
  "poly-hammer-utils",
  "pyufbx",
  "ruff>=0.8.0",
  "pre-commit>=4.0.0",
  "pip>=25.3",
  "cairosvg>=2.9.0",
]
