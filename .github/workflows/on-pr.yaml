name: PR Checks
on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**.yaml"
      - "!src/**/release_notes.md"
      - "pyproject.toml"
      - "cspell.json"
      - ".pre-commit-config.yaml"

jobs:
  python-domain:
    name: Python domain tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools only
        run: python -m pip install pytest==9.0.2 coverage==7.13.5
      - name: Verify domain tests without Blender or native bindings
        run: python -m pytest tests/unit --require-no-blender -o addopts='' -o log_cli=false -q

  lint:
    name: Lint & Static Analysis
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-lint.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"

  # Test with Blender 4.5
  # Todo: Figure out why only these stall on CI
  # test-blender-4-5-ubuntu-latest:
  #   needs: [lint]
  #   name: Blender 4.5 Tests
  #   uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
  #   secrets: inherit
  #   with:
  #     timeout-minutes: 90
  #     python-version: "3.11"
  #     blender-version: "4.5"
  #     runner-os: "ubuntu-latest"
  #     addon-id: "character_dna"
  #     base: "character-dna"
  #     base-branch: ${{ github.head_ref }}

  test-blender-4-5-windows-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.head_ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  test-blender-4-5-macos-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.head_ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  # Test with Blender 5.1
  test-blender-5-2-ubuntu-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.head_ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  test-blender-5-2-windows-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.head_ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  test-blender-5-2-macos-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.head_ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  benchmark-blender-4-5:
    needs: [test-blender-4-5-windows-latest, test-blender-4-5-macos-latest]
    name: Blender 4.5 Benchmark
    uses: poly-hammer/character-dna-addon/.github/workflows/re-use-benchmark.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "ubuntu-latest"
      iterations: 50
      warmup: 10
      threshold: 15
      is-push: ${{ github.event_name == 'push' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}

  benchmark-blender-5-2:
    needs: [test-blender-5-2-ubuntu-latest, test-blender-5-2-windows-latest, test-blender-5-2-macos-latest]
    name: Blender 5.2 Benchmark
    uses: poly-hammer/character-dna-addon/.github/workflows/re-use-benchmark.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "ubuntu-latest"
      iterations: 50
      warmup: 10
      threshold: 15
      is-push: ${{ github.event_name == 'push' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}
