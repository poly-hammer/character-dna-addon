name: Publish documentation updates
on:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notify:
    if: vars.DOCS_PIPELINE_ENABLED == 'true'
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-docs-notify.yaml@e013b6ffe4ccf1d562f51fc98bbde3f06b856a73
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
