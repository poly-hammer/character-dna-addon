name: Publish documentation updates
on:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notify:
    if: vars.DOCS_PIPELINE_ENABLED == 'true'
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-docs-notify.yaml@39a8928ba112ccf9d3054f6659bd8be7e6f9e667
    secrets:
      DOCS_DISPATCH_APP_KEY: ${{ secrets.DOCS_DISPATCH_APP_KEY }}
