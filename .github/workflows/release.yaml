name: Release Checks
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  lint:
    name: Lint & Static Analysis
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-lint.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"

  # Test with Blender 4.5
  # Todo: Figure out why only these stall on CI
  # test-blender-4-5-ubuntu-latest:
  #   needs: [lint]
  #   name: Blender 4.5 Tests
  #   uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
  #   secrets: inherit
  #   with:
  #     python-version: "3.11"
  #     blender-version: "4.5"
  #     runner-os: "ubuntu-latest"
  #     addon-id: "character_dna"
  #     base: "character-dna"

  test-blender-4-5-windows-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"

  test-blender-4-5-macos-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"

  # Test with Blender 5.2
  test-blender-5-2-ubuntu-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"

  test-blender-5-2-windows-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"

  test-blender-5-2-macos-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"

  release:
    needs:
      [
        test-blender-5-2-ubuntu-latest,
        test-blender-5-2-windows-latest,
        test-blender-5-2-macos-latest,
        # test-blender-4-5-ubuntu-latest,
        test-blender-4-5-windows-latest,
        test-blender-4-5-macos-latest,
      ]
    name: Release
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-release.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      environment: ${{ github.event.inputs.environment || 'staging' }}
      addon-id: "character_dna"
