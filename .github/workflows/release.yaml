name: Release Checks
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release-set-run:
        description: "Successful complete Character DNA Core candidate run ID"
        required: false
        type: string
      rollback:
        description: "Restore the previous channel indices for this exact release set"
        type: boolean
        default: false
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  lint:
    name: Lint & Static Analysis
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-lint.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"

  native:
    uses: poly-hammer/character-dna-core/.github/workflows/native.yaml@59c8d5f5cc998fa8548ff5483c60617f2e2f2902
    secrets: inherit
    with:
      core-sha: 59c8d5f5cc998fa8548ff5483c60617f2e2f2902

  test-blender-4-5-ubuntu-latest:
    needs: [lint, native]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      wheel-artifacts: character-dna-core-*

  test-blender-4-5-windows-latest:
    needs: [lint, native]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      wheel-artifacts: character-dna-core-*

  test-blender-4-5-macos-latest:
    needs: [lint, native]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      wheel-artifacts: character-dna-core-*

  # Test with Blender 5.2
  test-blender-5-2-ubuntu-latest:
    needs: [lint, native]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      wheel-artifacts: character-dna-core-*

  test-blender-5-2-windows-latest:
    needs: [lint, native]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      wheel-artifacts: character-dna-core-*

  test-blender-5-2-macos-latest:
    needs: [lint, native]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      wheel-artifacts: character-dna-core-*

  release:
    needs:
      [
        test-blender-5-2-ubuntu-latest,
        test-blender-5-2-windows-latest,
        test-blender-5-2-macos-latest,
        test-blender-4-5-ubuntu-latest,
        test-blender-4-5-windows-latest,
        test-blender-4-5-macos-latest,
      ]
    if: github.event_name == 'workflow_dispatch' && inputs.release-set-run != ''
    name: Promote exact tested release set
    uses: ./.github/workflows/native-publish.yaml
    secrets: inherit
    with:
      release-set-run: ${{ inputs.release-set-run }}
      environment: ${{ inputs.environment || 'staging' }}
      rollback: ${{ inputs.rollback || false }}
