name: Release Checks
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# Keep per-test JSONL diagnostics and job deadlines. The periodic faulthandler
# watchdog can segfault while code objects change (python/cpython#158200).
jobs:
  lint:
    name: Lint & Static Analysis
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-lint.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"

  test-blender-4-5-ubuntu-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  test-blender-4-5-windows-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  test-blender-4-5-macos-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  # Test with Blender 5.2
  test-blender-5-2-ubuntu-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  test-blender-5-2-windows-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  test-blender-5-2-macos-latest:
    needs: [lint]
    name: Blender 5.2 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@5145eff254d87a53c9158e41edc25a18ea5c746c
    secrets: inherit
    with:
      timeout-minutes: 90
      python-version: "3.13"
      blender-version: "5.2"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"
      base-branch: ${{ github.ref }}
      test-env: |
        PYTEST_ADDOPTS=--test-run-report=reports/test-run.json

  release:
    needs:
      [
        test-blender-5-2-ubuntu-latest,
        test-blender-5-2-windows-latest,
        test-blender-5-2-macos-latest,
        test-blender-4-5-ubuntu-latest,
        test-blender-4-5-windows-latest,
        test-blender-4-5-macos-latest,
      ]
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: addon
          lfs: true
          submodules: true
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      # Pin the helper until its reviewed 0.4.4 update is published to PyPI.
      - uses: actions/checkout@v7
        with:
          repository: poly-hammer/poly-hammer-utils
          ref: 60b6a63236581832e10330b2c0cefcc017e40528
          path: poly-hammer-utils
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - name: Install the locked packaging environment and tested release helper
        working-directory: addon
        run: |
          uv sync --locked --python 3.13
          uv pip install --no-deps --reinstall ../poly-hammer-utils
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Create the standard add-on release with matching Core assets
        working-directory: addon
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ADDONS_FOLDER: ${{ github.workspace }}/addon/src/addons
          GITHUB_REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          PORTAL_API_KEY: ${{ inputs.environment == 'production' && secrets.POLY_HAMMER_PORTAL_API_KEY_PRODUCTION || secrets.POLY_HAMMER_PORTAL_API_KEY_STAGING }}
        run: uv run --no-sync python -m poly_hammer_utils.extension.character_dna
